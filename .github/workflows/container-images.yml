name: Build and publish container images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  changes:
    name: Detect affected modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      worker: ${{ steps.changes.outputs.worker }}
      dashboard: ${{ steps.changes.outputs.dashboard }}
      guidelines: ${{ steps.changes.outputs.guidelines }}
      infra: ${{ steps.changes.outputs.infra }}
      images: ${{ steps.changes.outputs.images }}
      build_images: ${{ steps.changes.outputs.build_images }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          args=(--base "${BASE_SHA}" --head "${HEAD_SHA}")
          if [ "${FULL_CHECK}" = true ]; then args+=(--full); fi
          python3 scripts/ci-changes.py "${args[@]}"
      - name: Verify CI policy tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_*.py'

  metadata:
    name: Release metadata checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify component version drift
        run: bash scripts/check-release-readiness.sh "v$(tr -d '[:space:]' < VERSION)" --metadata-only

      - name: Verify release tag matches the platform version
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/check-release-readiness.sh "${GITHUB_REF_NAME}" --metadata-only

  backend:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test and analyze backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

  worker:
    name: AI worker checks
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ai-worker/.python-version
          cache: pip
          cache-dependency-path: ai-worker/requirements.txt

      - name: Test AI worker
        working-directory: ai-worker
        run: |
          python -m pip install -r requirements.txt
          python -m pytest

  dashboard:
    name: Dashboard checks
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go for OpenAPI verification
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Regenerate OpenAPI
        working-directory: backend
        run: make swagger

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Bun downloads and Next.js compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            dashboard/.next/cache
          key: dashboard-${{ runner.os }}-${{ hashFiles('dashboard/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            dashboard-${{ runner.os }}-${{ hashFiles('dashboard/bun.lock') }}-

      - name: Verify dashboard
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun audit --production
          bun run generate-types
          git diff --exit-code -- types/generated/backend-openapi.ts ../backend/docs
          bun run lint
          bun run typecheck
          bun run test
          bun run build

  guidelines:
    name: Public portal checks
    needs: changes
    if: needs.changes.outputs.guidelines == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guidelines-platform/package-lock.json

      - name: Verify Guidelines Platform
        working-directory: guidelines-platform
        run: |
          npm ci
          npm audit --omit=dev
          npm run lint
          npm run test
          npm run build

  infra:
    name: Infrastructure checks
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck='' .github/workflows/*.yml

      - name: Validate development Compose
        run: docker compose --env-file infra/development.env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml config --quiet

      - name: Validate environment parity
        run: bash scripts/check-infra-env-parity.sh

      - name: Validate staging Compose
        run: docker compose --env-file infra/staging.env.example -f infra/docker-compose.yml config --quiet

      - name: Validate production Compose
        run: |
          bash -n infra/deploy-production.sh
          bash -n scripts/import-guideline-assets.sh
          jq -e '.schema_version == 1 and (.assets | type == "array") and (.assets | length > 0)' \
            scripts/manifests/ucg-2023-assets.json >/dev/null
          duplicate_paths="$(jq -r '.assets[].markdown_path' scripts/manifests/ucg-2023-assets.json | sort | uniq -d)"
          test -z "${duplicate_paths}" || { echo "Duplicate guideline asset Markdown paths: ${duplicate_paths}" >&2; exit 1; }
          while IFS= read -r asset_file; do
            test -s "scripts/manifests/${asset_file}" || { echo "Missing guideline asset source: ${asset_file}" >&2; exit 1; }
          done < <(jq -r '.assets[].file' scripts/manifests/ucg-2023-assets.json)
          docker compose --env-file infra/production.env.example -f infra/docker-compose.yml config --quiet
          python3 infra/check-production-ports.py \
            --env-file infra/production.env.example \
            --compose-file infra/docker-compose.yml

  quality:
    # Keep this name stable for existing branch-protection rules.
    name: Platform quality gate
    if: always()
    needs: [changes, metadata, backend, worker, dashboard, guidelines, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful applicable checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          for name in ('changes', 'metadata'):
              if results[name]['result'] != 'success' and name not in failed:
                  failed.append(name)
          if failed:
              raise SystemExit('CI failed or cancelled: ' + ', '.join(failed))
          print('All applicable module checks passed.')
          PY

  build:
    name: Build ${{ matrix.name }}
    # PRs retain the quality gate, but never allocate Docker build runners.
    # Release tags must still produce the complete immutable deployment set.
    if: >-
      github.repository == 'mohuganda/mediguide-pos' &&
      needs.changes.outputs.build_images == 'true' &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [quality, changes]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name
        id: image
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          owner="$(printf '%s' "${GHCR_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Prepare build arguments
        id: build-args
        env:
          IMAGE_NAME: ${{ matrix.package }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          DASHBOARD_BASE_PATH: ${{ vars.DASHBOARD_BASE_PATH }}
        run: |
          {
            echo "value<<EOF"
            echo "BUILD_VERSION=$(tr -d '[:space:]' < VERSION)"
            echo "BUILD_REVISION=${GITHUB_SHA}"
            if [ "${IMAGE_NAME}" = mediguide-pos-dashboard ]; then
              echo "NEXT_PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://localhost:8080}"
              echo "NEXT_PUBLIC_DASHBOARD_BASE_PATH=${DASHBOARD_BASE_PATH:-/admin}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=MediGuide ${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.name }} image for MediGuide POS

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ steps.build-args.outputs.value }}
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.package }}
          # Cache storage is an optimisation, not a release artifact. Keep the
          # export compact and do not fail otherwise-valid image builds when
          # the repository's GitHub Actions cache quota is temporarily full.
          cache-to: type=gha,mode=min,scope=${{ matrix.package }},ignore-error=true
          provenance: mode=max
          sbom: true

  release-images:
    name: Verify released image set
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all immutable GHCR tags
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          owner="$(printf '%s' "${GHCR_OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="${RELEASE_TAG#v}"
          for package in \
            mediguide-pos-api \
            mediguide-pos-ai-worker \
            mediguide-pos-dashboard \
            mediguide-pos-guidelines; do
            docker buildx imagetools inspect "ghcr.io/${owner}/${package}:${version}"
          done

  deploy-production:
    name: Deploy released stack
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-images
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-production.yml
    with:
      release_tag: ${{ github.ref_name }}
      revision: ${{ github.sha }}
    secrets: inherit
