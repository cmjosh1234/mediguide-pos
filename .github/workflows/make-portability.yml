name: Make portability

on:
  pull_request:
    paths:
      - Makefile
      - backend/Makefile
      - scripts/**
      - infra/*.env*
      - infra/docker-compose*.yml
      - .gitattributes
      - .github/workflows/make-portability.yml
  push:
    branches: [main]
    paths:
      - Makefile
      - backend/Makefile
      - scripts/**
      - infra/*.env*
      - infra/docker-compose*.yml
      - .gitattributes
      - .github/workflows/make-portability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native GNU Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check Make targets and dependency installer
        run: python -m unittest discover -s scripts/tests -p test_make_portability.py -v
