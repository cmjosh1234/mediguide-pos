name: Upload mobile production candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable unified release tag (for example v2.0.25)
        required: true
        type: string
      destination:
        description: Production store destination
        required: true
        default: all
        type: choice
        options:
          - all
          - google-play
          - firebase-android
          - app-store
      confirmation:
        description: Enter the release tag again to confirm the store upload
        required: true
        type: string
      release_notes:
        description: Optional internal production-candidate notes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-production
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8
  RUBY_VERSION: "3.3"
  MOBILE_FLAVOR: production
  MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://mediguide.health.go.ug' }}
  ANDROID_PACKAGE_NAME: com.mediguide.ug
  IOS_BUNDLE_IDENTIFIER: com.omarsoft.mediguide
  RELEASE_NOTES: ${{ inputs.release_notes }}

jobs:
  metadata:
    name: Validate stable release
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Require confirmation and stable tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production requires a stable vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          if [ "${CONFIRMATION}" != "${RELEASE_TAG}" ]; then
            echo "confirmation must exactly match ${RELEASE_TAG}." >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify release metadata and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          bash scripts/check-release-readiness.sh "${RELEASE_TAG}" --metadata-only
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "${RELEASE_TAG} is not contained in origin/main." >&2
            exit 1
          fi

      - name: Read mobile version
        id: version
        run: |
          set -euo pipefail
          full_version="$(sed -n 's/^version:[[:space:]]*//p' user_app/pubspec.yaml | head -n 1)"
          app_version="${full_version%%+*}"
          build_number="${full_version##*+}"
          if ! [[ "${build_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "The release tag does not contain a valid mobile build number." >&2
            exit 1
          fi
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${build_number}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Mobile production candidate"
            echo
            echo "- Release: ${{ inputs.release_tag }}"
            echo "- Mobile version: ${app_version}+${build_number}"
            echo "- Destination: ${{ inputs.destination }}"
            echo "- Public rollout: disabled"
          } >> "${GITHUB_STEP_SUMMARY}"

  preflight:
    name: Validate selected release credentials
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Validate configuration without exposing secrets
        env:
          DESTINATION: ${{ inputs.destination == 'all' && 'production-all' || inputs.destination }}
          MOBILE_FLAVOR: production
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_MOBILE_CONFIG_JSON: ${{ secrets.FIREBASE_MOBILE_CONFIG_JSON }}
          FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_FIREBASE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_FIREBASE_PROVISIONING_PROFILE_BASE64 }}
          IOS_FIREBASE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_FIREBASE_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_TESTFLIGHT_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_TESTFLIGHT_PROVISIONING_PROFILE_BASE64 }}
          IOS_TESTFLIGHT_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_TESTFLIGHT_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_APP_STORE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_APP_STORE_EXPORT_OPTIONS_PLIST_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/ci-mobile-preflight.py "${DESTINATION}"

  quality:
    name: Verify production source
    needs: [metadata, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: user_app
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check Google Play draft prerequisites
        if: inputs.destination == 'all' || inputs.destination == 'google-play'
        # This workflow only creates an uncommitted production-track draft.
        # Policy evidence remains mandatory before any rollout workflow may
        # promote that draft to testers or production users.
        run: python3 tool/check_play_store.py

  firebase-android:
    name: Distribute production Android build to Firebase
    if: inputs.destination == 'all' || inputs.destination == 'firebase-android'
    needs:
      - metadata
      - quality
      - preflight
    uses: ./.github/workflows/mobile-distribution.yml
    with:
      destination: firebase-android
      api_base_url: ${{ vars.MOBILE_API_BASE_URL || 'https://mediguide.health.go.ug' }}
      release_notes: ${{ inputs.release_notes }}
      build_number: ${{ needs.metadata.outputs.build_number }}
      tester_groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'mediguide-testers' }}
      flavor: production
      github_environment: production
      source_ref: ${{ inputs.release_tag }}
    secrets: inherit

  google-play:
    name: Upload draft to Google Play production
    if: inputs.destination == 'all' || inputs.destination == 'google-play'
    needs:
      - metadata
      - quality
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://mediguide.health.go.ug' }}
    defaults:
      run:
        working-directory: user_app
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Restore trusted release automation
        env:
          RELEASE_AUTOMATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Keep the application source immutable at the release tag while
          # allowing post-release fixes to draft-only distribution tooling.
          git fetch origin "${RELEASE_AUTOMATION_SHA}" --depth=1
          git show "${RELEASE_AUTOMATION_SHA}:user_app/fastlane/Fastfile" > fastlane/Fastfile
          git show "${RELEASE_AUTOMATION_SHA}:user_app/tool/check_play_store.py" > tool/check_play_store.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: user_app

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Materialize Android production credentials
        env:
          FIREBASE_MOBILE_CONFIG_JSON: ${{ secrets.FIREBASE_MOBILE_CONFIG_JSON }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            FIREBASE_MOBILE_CONFIG_JSON
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_UPLOAD_STORE_PASSWORD
            ANDROID_UPLOAD_KEY_ALIAS
            ANDROID_UPLOAD_KEY_PASSWORD
            GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64
          )
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Android production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "${FIREBASE_MOBILE_CONFIG_JSON}" > firebase-dart-defines.json
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64}" | base64 --decode > google-play-service-account.json
          test -s firebase-dart-defines.json
          test -s android/app/upload-keystore.jks
          test -s google-play-service-account.json
          jq -e . firebase-dart-defines.json >/dev/null
          jq -e . google-play-service-account.json >/dev/null
          chmod 600 android/app/upload-keystore.jks google-play-service-account.json
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_UPLOAD_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_UPLOAD_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_UPLOAD_KEY_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "${ANDROID_UPLOAD_STORE_PASSWORD}" \
            -alias "${ANDROID_UPLOAD_KEY_ALIAS}" >/dev/null

      - name: Build and upload Google Play draft
        env:
          FIREBASE_DART_DEFINES_FILE: ${{ github.workspace }}/user_app/firebase-dart-defines.json
          GOOGLE_PLAY_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/user_app/google-play-service-account.json
          MOBILE_BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
        run: bundle exec fastlane android play_store_release

      - name: Upload production Android artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-production-android-${{ github.run_id }}
          path: user_app/build/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 0

      - name: Remove Android credentials
        if: always()
        run: |
          rm -f firebase-dart-defines.json google-play-service-account.json
          rm -f android/key.properties android/app/upload-keystore.jks

  app-store:
    name: Upload candidate to App Store Connect
    if: inputs.destination == 'all' || inputs.destination == 'app-store'
    needs:
      - metadata
      - quality
      - preflight
    runs-on: macos-latest
    timeout-minutes: 120
    environment: production
    env:
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://mediguide.health.go.ug' }}
    defaults:
      run:
        working-directory: user_app
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('user_app/ios/Podfile.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: user_app

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Materialize Apple production credentials
        env:
          FIREBASE_MOBILE_CONFIG_JSON: ${{ secrets.FIREBASE_MOBILE_CONFIG_JSON }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_APP_STORE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_APP_STORE_EXPORT_OPTIONS_PLIST_BASE64 }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required=(
            FIREBASE_MOBILE_CONFIG_JSON
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_APP_STORE_PROVISIONING_PROFILE_BASE64
            IOS_APP_STORE_EXPORT_OPTIONS_PLIST_BASE64
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APPLE_TEAM_ID
          )
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Apple production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "${FIREBASE_MOBILE_CONFIG_JSON}" > firebase-dart-defines.json
          printf '%s' "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" | base64 -D > ios/distribution.p12
          printf '%s' "${IOS_APP_STORE_PROVISIONING_PROFILE_BASE64}" | base64 -D > ios/app-store.mobileprovision
          printf '%s' "${IOS_APP_STORE_EXPORT_OPTIONS_PLIST_BASE64}" | base64 -D > ios/ExportOptions-AppStore.plist
          printf '%s' "${APP_STORE_CONNECT_PRIVATE_KEY_BASE64}" | base64 -D > ios/AuthKey.p8
          test -s firebase-dart-defines.json
          test -s ios/distribution.p12
          test -s ios/app-store.mobileprovision
          test -s ios/ExportOptions-AppStore.plist
          test -s ios/AuthKey.p8
          jq -e . firebase-dart-defines.json >/dev/null
          plutil -lint ios/ExportOptions-AppStore.plist
          chmod 600 ios/distribution.p12 ios/AuthKey.p8

      - name: Install Apple certificate and profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/mediguide-production.keychain-db"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import ios/distribution.p12 \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" \
            "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain-db

          decoded="${RUNNER_TEMP}/app-store-profile.plist"
          security cms -D -i ios/app-store.mobileprovision > "${decoded}"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${decoded}")"
          profiles="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${profiles}"
          cp ios/app-store.mobileprovision "${profiles}/${uuid}.mobileprovision"

      - name: Build and upload App Store candidate
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_FILE: ${{ github.workspace }}/user_app/ios/AuthKey.p8
          FIREBASE_DART_DEFINES_FILE: ${{ github.workspace }}/user_app/firebase-dart-defines.json
          IOS_APP_STORE_EXPORT_OPTIONS_PLIST: ${{ github.workspace }}/user_app/ios/ExportOptions-AppStore.plist
          MOBILE_BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
        run: bundle exec fastlane ios app_store_release

      - name: Upload production Apple artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-production-ios-${{ github.run_id }}
          path: user_app/build/ios/app-store/*.ipa
          if-no-files-found: ignore
          retention-days: 90
          compression-level: 0

      - name: Remove Apple credentials and temporary keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/mediguide-production.keychain-db" 2>/dev/null || true
          rm -f firebase-dart-defines.json ios/distribution.p12 ios/AuthKey.p8
          rm -f ios/app-store.mobileprovision ios/ExportOptions-AppStore.plist
