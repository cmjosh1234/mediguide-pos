name: Deploy production

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing immutable release tag to deploy
        required: true
        type: string
      revision:
        description: Full Git revision associated with the release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to deploy, for example v2.0.18
        required: true
        type: string
      revision:
        description: Optional full Git SHA; defaults to the tag commit
        required: false
        type: string
      skip_public_storage_check:
        description: Operator override to skip only the public MinIO network check
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: mediguide-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Replace production stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out immutable release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate release inputs
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          GHCR_OWNER_INPUT: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          bash scripts/check-release-readiness.sh "${RELEASE_TAG}" --metadata-only
          actual_revision="$(git rev-parse HEAD)"
          if [ -n "${REQUESTED_REVISION}" ] && [ "${REQUESTED_REVISION}" != "${actual_revision}" ]; then
            echo "Requested revision does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          owner="$(printf '%s' "${GHCR_OWNER_INPUT}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${RELEASE_TAG#v}"
            echo "revision=${actual_revision}"
            echo "owner=${owner}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          AI_WORKER_SECRET: ${{ secrets.AI_WORKER_SECRET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          DASHBOARD_PUBLIC_URL: ${{ vars.DASHBOARD_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for name in \
            DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH \
            DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS PRODUCTION_ENV_FILE \
            AI_WORKER_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub secret ${name} is missing." >&2
              exit 1
            fi
          done
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST is invalid." >&2; exit 1; }
          [[ "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ ]] || { echo "DEPLOY_PORT is invalid." >&2; exit 1; }
          (( 10#${DEPLOY_PORT} >= 1 && 10#${DEPLOY_PORT} <= 65535 )) || { echo "DEPLOY_PORT is out of range." >&2; exit 1; }
          [[ "${DEPLOY_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "DEPLOY_USER is invalid." >&2; exit 1; }
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_PATH must be a safe absolute path." >&2; exit 1; }
          [[ "${DEPLOY_PATH}" != "/" && "${DEPLOY_PATH}" != *"/../"* && "${DEPLOY_PATH}" != *"/.." && "${DEPLOY_PATH}" != *"/./"* && "${DEPLOY_PATH}" != *"/." ]] || {
            echo "DEPLOY_PATH cannot be root or contain relative path components." >&2
            exit 1
          }
          for name in PUBLIC_SITE_URL PUBLIC_API_BASE_URL DASHBOARD_PUBLIC_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Required production GitHub variable ${name} is missing." >&2
              exit 1
            fi
            if [[ ! "${!name}" =~ ^https://[^[:space:]]+$ ]]; then
              echo "Production variable ${name} must be an absolute HTTPS URL." >&2
              exit 1
            fi
          done
          expected_dashboard_url="${PUBLIC_SITE_URL%/}/admin/login"
          if [ "${DASHBOARD_PUBLIC_URL%/}" != "${expected_dashboard_url}" ]; then
            echo "DASHBOARD_PUBLIC_URL must be ${expected_dashboard_url}." >&2
            exit 1
          fi
          if [ "${PUBLIC_API_BASE_URL%/}" != "${PUBLIC_SITE_URL%/}" ]; then
            echo "PUBLIC_API_BASE_URL must use the public site origin without an /api suffix." >&2
            exit 1
          fi

      - name: Prepare deployment bundle
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          AI_WORKER_SECRET: ${{ secrets.AI_WORKER_SECRET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          DASHBOARD_PUBLIC_URL: ${{ vars.DASHBOARD_PUBLIC_URL }}
          S3_PUBLIC_ENDPOINT: ${{ vars.S3_PUBLIC_ENDPOINT }}
          S3_PUBLIC_SSL: ${{ vars.S3_PUBLIC_SSL }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${PRODUCTION_ENV_FILE}" > infra/production.env
          # Keep internal worker authentication independent from the bundled
          # environment file so it can be rotated without replacing every
          # production setting. Remove stale entries before appending the
          # protected value and canonical transport defaults.
          awk -F= '
            $1 != "AI_WORKER_SECRET" &&
            $1 != "AI_WORKER_GRPC_RETRIES" &&
            $1 != "AI_WORKER_GRPC_HEALTH_TIMEOUT_SECONDS"
          ' infra/production.env > "${RUNNER_TEMP}/production.env"
          mv "${RUNNER_TEMP}/production.env" infra/production.env
          {
            printf 'AI_WORKER_SECRET=%s\n' "${AI_WORKER_SECRET}"
            printf 'AI_WORKER_GRPC_RETRIES=1\n'
            printf 'AI_WORKER_GRPC_HEALTH_TIMEOUT_SECONDS=2\n'
            echo
            echo "# Canonical browser-visible URLs managed by GitHub Actions variables."
            printf 'PUBLIC_SITE_URL=%s\n' "${PUBLIC_SITE_URL%/}"
            printf 'PUBLIC_API_BASE_URL=%s\n' "${PUBLIC_API_BASE_URL%/}"
            printf 'DASHBOARD_PUBLIC_URL=%s\n' "${DASHBOARD_PUBLIC_URL%/}"
            printf 'DASHBOARD_BASE_PATH=/admin\n'
            printf 'ALLOWED_ORIGINS=%s\n' "${PUBLIC_SITE_URL%/}"
          } >> infra/production.env

          # Public storage routing can be updated independently of credential secrets.
          # Empty variables retain the endpoint supplied in the protected env bundle.
          if [ -n "${S3_PUBLIC_ENDPOINT}" ]; then
            printf 'S3_PUBLIC_ENDPOINT=%s\n' "${S3_PUBLIC_ENDPOINT}" >> infra/production.env
            printf 'S3_PUBLIC_SSL=%s\n' "${S3_PUBLIC_SSL:-true}" >> infra/production.env
          fi
          printf 'MINIO_API_CORS_ALLOW_ORIGIN=%s\n' "${PUBLIC_SITE_URL%/}" >> infra/production.env
          python3 infra/organize-env.py infra/production.env --private
          python3 infra/check-production-env.py infra/production.env
          python3 infra/check-public-storage.py infra/production.env

          # Firebase Admin is optional, but a malformed non-empty credential
          # makes both the API and notification worker fail during startup.
          # Validate it before any files are copied to the production host.
          firebase_credentials="$(sed -n 's/^FIREBASE_SERVICE_ACCOUNT_BASE64=//p' infra/production.env | tail -n 1)"
          firebase_project="$(sed -n 's/^FIREBASE_PROJECT_ID=//p' infra/production.env | tail -n 1)"
          if [ -n "${firebase_credentials}" ]; then
            firebase_json="${RUNNER_TEMP}/firebase-service-account.json"
            if ! printf '%s' "${firebase_credentials}" | base64 --decode > "${firebase_json}"; then
              echo "FIREBASE_SERVICE_ACCOUNT_BASE64 is not valid base64." >&2
              exit 1
            fi
            if ! jq -e '
              (.project_id | type == "string" and length > 0) and
              (.client_email | type == "string" and length > 0) and
              (.private_key | type == "string" and length > 0)
            ' "${firebase_json}" >/dev/null; then
              echo "FIREBASE_SERVICE_ACCOUNT_BASE64 is not a valid Firebase service-account JSON document." >&2
              exit 1
            fi
            credential_project="$(jq -r '.project_id' "${firebase_json}")"
            if [ -n "${firebase_project}" ] && [ "${firebase_project}" != "${credential_project}" ]; then
              echo "FIREBASE_PROJECT_ID does not match the Firebase service account." >&2
              exit 1
            fi
            rm -f "${firebase_json}"
          fi
          asset_import_enabled="$(sed -n 's/^GUIDELINE_ASSET_IMPORT_ENABLED=//p' infra/production.env | tail -n 1 | tr -d '\r')"
          if [ "${asset_import_enabled:-0}" = '1' ]; then
            asset_file_list="${RUNNER_TEMP}/guideline-asset-files.txt"
            jq -r '.assets[].file | sub("^../../"; "")' \
              scripts/manifests/ucg-2023-assets.json > "${asset_file_list}"
            while IFS= read -r asset_file; do
              test -s "${asset_file}" || { echo "Missing guideline asset source: ${asset_file}" >&2; exit 1; }
            done < "${asset_file_list}"
            tar -czf "${RUNNER_TEMP}/mediguide-infra.tar.gz" \
              -T "${asset_file_list}" \
              infra \
              scripts/import-guideline-assets.sh \
              scripts/manifests/ucg-2023-assets.json
          else
            tar -czf "${RUNNER_TEMP}/mediguide-infra.tar.gz" infra
          fi

      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/mediguide_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"

      - name: Reclaim superseded MediGuide image storage
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GHCR_OWNER: ${{ steps.release.outputs.owner }}
        run: |
          set -euo pipefail
          ssh_key="${HOME}/.ssh/mediguide_deploy"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_options=(
            -i "${ssh_key}"
            -p "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          ssh "${ssh_options[@]}" "${target}" bash -s -- \
            "${RELEASE_VERSION}" "${GHCR_OWNER}" <<'REMOTE'
          set -euo pipefail
          release_version="$1"
          ghcr_owner="$2"
          echo "Storage before scoped cleanup:"
          df -h /
          docker system df

          while IFS= read -r image_ref; do
            [ -n "${image_ref}" ] || continue
            case "${image_ref}" in
              "ghcr.io/${ghcr_owner}/mediguide-pos-api:${release_version}"|\
              "ghcr.io/${ghcr_owner}/mediguide-pos-ai-worker:${release_version}"|\
              "ghcr.io/${ghcr_owner}/mediguide-pos-dashboard:${release_version}"|\
              "ghcr.io/${ghcr_owner}/mediguide-pos-guidelines:${release_version}")
                continue
                ;;
            esac
            docker image rm "${image_ref}" || true
          done < <(
            docker image ls --format '{{.Repository}}:{{.Tag}}' | \
              grep -E "^ghcr\.io/${ghcr_owner}/mediguide-pos-(api|ai-worker|dashboard|guidelines):" || true
          )
          docker image prune --force

          echo "Storage after scoped cleanup:"
          df -h /
          docker system df
          REMOTE

      - name: Copy infra and deploy immutable images
        env:
          SKIP_PUBLIC_STORAGE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_public_storage_check || false }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
          GHCR_OWNER: ${{ steps.release.outputs.owner }}
        run: |
          set -euo pipefail
          [[ "${GHCR_USERNAME}" =~ ^[A-Za-z0-9-]+$ ]] || { echo "GitHub actor is invalid for registry login." >&2; exit 1; }
          ssh_key="${HOME}/.ssh/mediguide_deploy"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_stage="${DEPLOY_PATH}/.deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_options=(
            -i "${ssh_key}"
            -p "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
          )

          ssh "${ssh_options[@]}" "${target}" \
            "mkdir -p '${DEPLOY_PATH}' '${remote_stage}/docker-config'"
          scp -i "${ssh_key}" -P "${DEPLOY_PORT}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes \
            "${RUNNER_TEMP}/mediguide-infra.tar.gz" \
            "${target}:${remote_stage}/infra.tar.gz"

          registry_login_succeeded=false
          for attempt in {1..12}; do
            if printf '%s' "${GHCR_TOKEN}" | ssh "${ssh_options[@]}" "${target}" \
              "DOCKER_CONFIG='${remote_stage}/docker-config' docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"; then
              registry_login_succeeded=true
              break
            fi
            echo "GHCR login attempt ${attempt}/12 failed; retrying." >&2
            sleep 10
          done
          if [ "${registry_login_succeeded}" != true ]; then
            echo "Unable to authenticate the production host to GHCR after 12 attempts." >&2
            exit 1
          fi

          ssh "${ssh_options[@]}" "${target}" bash -s -- \
            "${DEPLOY_PATH}" "${remote_stage}" "${RELEASE_VERSION}" \
            "${RELEASE_REVISION}" "${GHCR_OWNER}" "${SKIP_PUBLIC_STORAGE_CHECK}" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          remote_stage="$2"
          release_version="$3"
          release_revision="$4"
          ghcr_owner="$5"
          skip_public_storage_check="$6"
          [[ "${skip_public_storage_check}" == true || "${skip_public_storage_check}" == false ]] || {
            echo "Invalid public storage check override." >&2
            exit 1
          }

          [[ "${deploy_path}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Unsafe deployment path." >&2; exit 1; }
          [[ "${deploy_path}" != "/" && "${deploy_path}" != *"/../"* && "${deploy_path}" != *"/.." && "${deploy_path}" != *"/./"* && "${deploy_path}" != *"/." ]] || {
            echo "Unsafe deployment path components." >&2
            exit 1
          }

          case "${remote_stage}" in
            "${deploy_path}"/.deploy-*) ;;
            *) echo "Unsafe remote staging path." >&2; exit 1 ;;
          esac

          export DOCKER_CONFIG="${remote_stage}/docker-config"

          cleanup() {
            rm -rf -- "${remote_stage}"
          }
          trap cleanup EXIT

          extracted="${remote_stage}/extracted"
          mkdir -p "${extracted}"
          tar -xzf "${remote_stage}/infra.tar.gz" -C "${extracted}"
          test -f "${extracted}/infra/docker-compose.yml"
          test -f "${extracted}/infra/deploy-production.sh"
          test -s "${extracted}/infra/production.env"

          if [ -d "${extracted}/scripts" ]; then
            asset_import_bundle="${deploy_path}/asset-import"
            asset_import_previous="${deploy_path}/asset-import.previous"
            rm -rf -- "${asset_import_previous}"
            if [ -d "${asset_import_bundle}" ]; then
              mv "${asset_import_bundle}" "${asset_import_previous}"
            fi
            mkdir -p "${extracted}/asset-import"
            mv "${extracted}/scripts" "${extracted}/asset-import/scripts"
            mv "${extracted}/guidelines-platform" "${extracted}/asset-import/guidelines-platform"
            mv "${extracted}/asset-import" "${asset_import_bundle}"
          fi

          # Fetch and verify every immutable first-party image before replacing
          # the current configuration or stopping any healthy containers.
          # Pull one image at a time so transient registry failures can resume
          # from Docker's local layer cache.
          release_images=(
            "ghcr.io/${ghcr_owner}/mediguide-pos-api:${release_version}"
            "ghcr.io/${ghcr_owner}/mediguide-pos-ai-worker:${release_version}"
            "ghcr.io/${ghcr_owner}/mediguide-pos-dashboard:${release_version}"
            "ghcr.io/${ghcr_owner}/mediguide-pos-guidelines:${release_version}"
          )
          for image in "${release_images[@]}"; do
            pulled=false
            for attempt in {1..12}; do
              if docker pull "${image}"; then
                pulled=true
                break
              fi
              echo "Pull attempt ${attempt}/12 failed for ${image}; retrying." >&2
              sleep 10
            done
            if [ "${pulled}" != true ]; then
              echo "Unable to preload ${image}. The running stack was not modified." >&2
              exit 1
            fi
            docker image inspect "${image}" >/dev/null
          done

          deploy_script="${extracted}/infra/deploy-production.sh"
          deploy_script_name="deploy-production.sh"
          if ! grep -q 'MEDIGUIDE_IMAGES_PRELOADED' "${deploy_script}"; then
            # Compatibility for immutable releases created before preloading
            # support existed. Remove only the redundant two-line pull step
            # from a temporary executable copy; the tagged source is unchanged.
            compatible_script="${extracted}/infra/deploy-production-preloaded.sh"
            awk '
              $0 == "echo \"Pulling immutable release images.\"" { skip_pull = 1; next }
              skip_pull && $0 == "\"${compose[@]}\" pull" { skip_pull = 0; next }
              { print }
            ' "${deploy_script}" > "${compatible_script}"
            chmod 700 "${compatible_script}"
            deploy_script_name="deploy-production-preloaded.sh"
          fi

          if [ "${skip_public_storage_check}" = true ]; then
            # Published tags remain immutable. Make a temporary deployment
            # script that omits exactly the network probe requested by the
            # operator; retain storage format and every other health check.
            override_script="${extracted}/infra/deploy-production-storage-override.sh"
            awk '
              $0 == "python3 \"${infra_dir}/check-public-storage.py\" \"${production_env}\" --check-network" { removed++; next }
              { print }
              END { if (removed != 1) exit 1 }
            ' "${extracted}/infra/${deploy_script_name}" > "${override_script}"
            chmod 700 "${override_script}"
            deploy_script_name="deploy-production-storage-override.sh"
            echo "Operator override: skipping the public MinIO network probe for this deployment only."
          fi

          previous="${deploy_path}/infra.previous"
          rm -rf -- "${previous}"
          if [ -d "${deploy_path}/infra" ]; then
            mv "${deploy_path}/infra" "${previous}"
          fi
          mv "${extracted}/infra" "${deploy_path}/infra"
          chmod 600 "${deploy_path}/infra/production.env"

          MEDIGUIDE_IMAGES_PRELOADED=1 bash "${deploy_path}/infra/${deploy_script_name}" \
            "${release_version}" "${release_revision}" "${ghcr_owner}"
          REMOTE

      - name: Collect bounded production database diagnostics
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set +e
          ssh_key="${HOME}/.ssh/mediguide_deploy"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_options=(
            -i "${ssh_key}"
            -p "${DEPLOY_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          ssh "${ssh_options[@]}" "${target}" bash <<'REMOTE'
          set +e
          postgres_id="$(docker ps -aq \
            --filter label=com.docker.compose.project=mediguide \
            --filter label=com.docker.compose.service=postgres | head -n 1)"
          if [ -z "${postgres_id}" ]; then
            echo "No MediGuide PostgreSQL container was found." >&2
            exit 0
          fi

          echo "PostgreSQL container state:"
          docker inspect --format \
            'status={{.State.Status}} restart_count={{.RestartCount}} exit_code={{.State.ExitCode}} error={{.State.Error}}' \
            "${postgres_id}"
          echo "PostgreSQL health history:"
          docker inspect --format '{{range .State.Health.Log}}{{.End}} exit={{.ExitCode}} {{printf "%.500s" .Output}}{{println}}{{end}}' \
            "${postgres_id}"
          echo "PostgreSQL startup logs (last 150 lines):"
          docker logs --tail 150 "${postgres_id}" 2>&1
          REMOTE
