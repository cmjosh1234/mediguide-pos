name: Build Play Store verification bundle

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused increasing Google Play version code
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: play-store-verification
  cancel-in-progress: false

jobs:
  backend-and-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify deletion and authentication services
        working-directory: backend
        run: go test ./internal/services ./internal/handlers ./internal/app
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: guidelines-platform/package-lock.json
      - run: npm ci
        working-directory: guidelines-platform
      - run: npm run verify
        working-directory: guidelines-platform

  android:
    needs: backend-and-portal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: user_app
    env:
      MOBILE_FLAVOR: production
      MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://mediguide.health.go.ug' }}
      MOBILE_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: user_app
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: Materialize signing and Firebase configuration
        env:
          FIREBASE_MOBILE_CONFIG_JSON: ${{ secrets.FIREBASE_MOBILE_CONFIG_JSON }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re
          required = ("FIREBASE_MOBILE_CONFIG_JSON", "ANDROID_UPLOAD_KEYSTORE_BASE64",
                      "ANDROID_UPLOAD_STORE_PASSWORD", "ANDROID_UPLOAD_KEY_ALIAS",
                      "ANDROID_UPLOAD_KEY_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing release secrets: " + ", ".join(missing))
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["MOBILE_BUILD_NUMBER"]):
              raise SystemExit("Build number must be a positive integer")
          os.umask(0o077)
          config = json.loads(os.environ["FIREBASE_MOBILE_CONFIG_JSON"])
          pathlib.Path("firebase-dart-defines.json").write_text(json.dumps(config))
          pathlib.Path("android/app/upload-keystore.jks").write_bytes(
              base64.b64decode(os.environ["ANDROID_UPLOAD_KEYSTORE_BASE64"], validate=True))
          def escape(value):
              return "".join("\\u%04x" % ord(c) if c in "\\ \t\n\r=:#!" else c for c in value)
          props = {"storeFile": "upload-keystore.jks",
                   "storePassword": os.environ["ANDROID_UPLOAD_STORE_PASSWORD"],
                   "keyAlias": os.environ["ANDROID_UPLOAD_KEY_ALIAS"],
                   "keyPassword": os.environ["ANDROID_UPLOAD_KEY_PASSWORD"]}
          pathlib.Path("android/key.properties").write_text(
              "\n".join(key + "=" + escape(value) for key, value in props.items()) + "\n")
          PY
      - name: Build signed AAB and store preparation pack
        env:
          FIREBASE_DART_DEFINES_FILE: ${{ github.workspace }}/user_app/firebase-dart-defines.json
        run: |
          bundle exec fastlane android build_release
          python3 tool/check_play_store.py --export
          sha256sum build/app/outputs/bundle/productionRelease/app-production-release.aab > build/aab-sha256.txt
      - name: Preserve verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-play-verification-${{ inputs.build_number }}
          path: |
            user_app/build/app/outputs/bundle/productionRelease/app-production-release.aab
            user_app/build/aab-sha256.txt
            user_app/build/mediguide-play-store-preparation.zip
          if-no-files-found: error
          retention-days: 30
      - name: Remove private configuration
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks firebase-dart-defines.json
