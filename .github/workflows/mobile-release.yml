name: Test and build mobile release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_web:
        description: Build optional Flutter web artifact
        type: boolean
        default: false
      build_unsigned_ios:
        description: Build optional unsigned iOS verification artifact
        type: boolean
        default: false
      build_macos:
        description: Build optional macOS verification artifact
        type: boolean
        default: false
      api_base_url:
        description: API URL embedded in the release builds
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  FLUTTER_VERSION: 3.44.8
  MOBILE_API_BASE_URL: ${{ inputs.api_base_url || vars.MOBILE_API_BASE_URL || 'https://mediguide.health.go.ug' }}

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.changes.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify mobile and shared contract changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          args=(--base "${BASE_SHA}" --head "${HEAD_SHA}")
          if [ "${FULL_CHECK}" = true ]; then args+=(--full); fi
          python3 scripts/ci-changes.py "${args[@]}"

  preflight:
    name: Validate selected release credentials
    if: github.repository == 'mohuganda/mediguide-pos' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Validate configuration without exposing secrets
        env:
          DESTINATION: android-artifacts
          MOBILE_FLAVOR: production
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_MOBILE_CONFIG_JSON: ${{ secrets.FIREBASE_MOBILE_CONFIG_JSON }}
          FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_FIREBASE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_FIREBASE_PROVISIONING_PROFILE_BASE64 }}
          IOS_FIREBASE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_FIREBASE_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_TESTFLIGHT_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_TESTFLIGHT_PROVISIONING_PROFILE_BASE64 }}
          IOS_TESTFLIGHT_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_TESTFLIGHT_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_APP_STORE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_APP_STORE_EXPORT_OPTIONS_PLIST_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          python3 scripts/ci-mobile-preflight.py "${DESTINATION}"
          if [ '${{ inputs.build_unsigned_ios }}' = true ]; then
            python3 scripts/ci-mobile-preflight.py ios-artifacts
          fi
          if [ '${{ inputs.build_web }}' = true ]; then
            python3 scripts/ci-mobile-preflight.py web-artifacts
          fi
          if [ '${{ inputs.build_macos }}' = true ]; then
            python3 scripts/ci-mobile-preflight.py macos-artifacts
          fi

  mobile-checks:
    name: Mobile source checks
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release tag matches the mobile version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-release-readiness.sh "${GITHUB_REF_NAME}" --metadata-only

      - name: Verify generated backend contracts
        run: |
          dart run tool/generate_backend_contracts.dart
          dart format lib/core/network/contracts/generated/backend_contracts.dart
          git diff --exit-code -- lib/core/network/contracts/generated/backend_contracts.dart

      - name: Verify generated Dart models
        run: |
          if [ -n "$(git ls-files '*.g.dart' '*.freezed.dart')" ]; then
            echo "Generated *.g.dart and *.freezed.dart files must not be committed." >&2
            git ls-files '*.g.dart' '*.freezed.dart' >&2
            exit 1
          fi
          dart run build_runner build --delete-conflicting-outputs
          dart format lib
          git diff --exit-code -- lib

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage-${{ github.run_id }}
          path: user_app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload golden comparison failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-golden-failures-${{ github.run_id }}
          path: user_app/test/failures
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Test and analyze
    if: always()
    needs: [changes, mobile-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require applicable mobile checks
        env:
          DETECTION: ${{ needs.changes.result }}
          CHECKS: ${{ needs.mobile-checks.result }}
        run: |
          test "${DETECTION}" = success
          test "${CHECKS}" = success || test "${CHECKS}" = skipped

  android:
    name: Build Android artifacts
    if: github.repository == 'mohuganda/mediguide-pos' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    needs: [quality, preflight]
    runs-on: ubuntu-latest
    environment: production
    # Recent warm builds take ~11 minutes; retain headroom for cold Gradle caches.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Firebase client identifiers
        env:
          FIREBASE_MOBILE_CONFIG_JSON: ${{ secrets.FIREBASE_MOBILE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_MOBILE_CONFIG_JSON}" ]; then
            echo "FIREBASE_MOBILE_CONFIG_JSON is required for a mobile release build." >&2
            exit 1
          fi
          printf '%s' "${FIREBASE_MOBILE_CONFIG_JSON}" > firebase-dart-defines.json
          test -s firebase-dart-defines.json
          echo "FIREBASE_BUILD_ARGS=--dart-define-from-file=${GITHUB_WORKSPACE}/user_app/firebase-dart-defines.json" >> "${GITHUB_ENV}"

      - name: Generate Dart sources for bundle
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure Android release signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_UPLOAD_KEYSTORE_BASE64}" ] || \
             [ -z "${ANDROID_UPLOAD_STORE_PASSWORD}" ] || \
             [ -z "${ANDROID_UPLOAD_KEY_ALIAS}" ] || \
             [ -z "${ANDROID_UPLOAD_KEY_PASSWORD}" ]; then
            echo "Android release-signing secrets are incomplete." >&2
            exit 1
          fi
          if ! printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks; then
            echo "ANDROID_UPLOAD_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "The decoded Android upload keystore is empty." >&2
            exit 1
          fi
          chmod 600 android/app/upload-keystore.jks
          if ! keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "${ANDROID_UPLOAD_STORE_PASSWORD}" \
            -alias "${ANDROID_UPLOAD_KEY_ALIAS}" >/dev/null; then
            echo "The Android upload keystore, password, or alias is invalid." >&2
            exit 1
          fi
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_UPLOAD_STORE_PASSWORD}"
            echo "keyAlias=${ANDROID_UPLOAD_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_UPLOAD_KEY_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Build release APK
        run: >-
          flutter build apk --release
          --split-per-abi
          --target-platform android-arm,android-arm64
          --flavor production
          --target lib/main_production.dart
          --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"
          --dart-define=MEDIGUIDE_FLAVOR=production
          --dart-define=MEDIGUIDE_DEBUG_TOOLS_ENABLED=false
          ${FIREBASE_BUILD_ARGS}

      - name: Build release app bundle
        run: >-
          flutter build appbundle --release
          --target-platform android-arm,android-arm64
          --flavor production
          --target lib/main_production.dart
          --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"
          --dart-define=MEDIGUIDE_FLAVOR=production
          --dart-define=MEDIGUIDE_DEBUG_TOOLS_ENABLED=false
          ${FIREBASE_BUILD_ARGS}

      - name: Enforce Android artifact size budgets
        run: |
          set -eu
          max_apk_bytes=$((45 * 1024 * 1024))
          max_aab_bytes=$((70 * 1024 * 1024))
          apk_count=0
          for artifact in build/app/outputs/flutter-apk/*production-release.apk; do
            test -f "${artifact}" || continue
            apk_count=$((apk_count + 1))
            bytes="$(wc -c < "${artifact}")"
            echo "$(basename "${artifact}"): ${bytes} bytes"
            if [ "${bytes}" -gt "${max_apk_bytes}" ]; then
              echo "${artifact} exceeds the 45 MiB direct-download budget." >&2
              exit 1
            fi
          done
          test "${apk_count}" -eq 2
          aab="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          aab_bytes="$(wc -c < "${aab}")"
          echo "$(basename "${aab}"): ${aab_bytes} bytes"
          if [ "${aab_bytes}" -gt "${max_aab_bytes}" ]; then
            echo "${aab} exceeds the 70 MiB upload budget." >&2
            exit 1
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-android-${{ github.run_id }}
          path: |
            user_app/build/app/outputs/flutter-apk/*production-release.apk
            user_app/build/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove Firebase build configuration
        if: always()
        run: rm -f firebase-dart-defines.json

  web:
    name: Build web artifact
    if: github.repository == 'mohuganda/mediguide-pos' && github.event_name == 'workflow_dispatch' && inputs.build_web
    needs: [quality, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart sources for bundle
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web release
        run: |
          bash tool/prepare_web_database.sh
          flutter build web --release \
            --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-web-${{ github.run_id }}
          path: user_app/build/web
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  apple:
    name: Build unsigned Apple artifacts
    if: github.repository == 'mohuganda/mediguide-pos' && github.event_name == 'workflow_dispatch' && (inputs.build_unsigned_ios || inputs.build_macos)
    needs: [quality, preflight]
    runs-on: macos-latest
    environment: production
    timeout-minutes: 45
    defaults:
      run:
        working-directory: user_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('user_app/ios/Podfile.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Firebase client identifiers
        env:
          FIREBASE_MOBILE_CONFIG_JSON: ${{ secrets.FIREBASE_MOBILE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_MOBILE_CONFIG_JSON}" ]; then
            echo "FIREBASE_MOBILE_CONFIG_JSON is required for a mobile release build." >&2
            exit 1
          fi
          printf '%s' "${FIREBASE_MOBILE_CONFIG_JSON}" > firebase-dart-defines.json
          test -s firebase-dart-defines.json
          echo "FIREBASE_BUILD_ARGS=--dart-define-from-file=${GITHUB_WORKSPACE}/user_app/firebase-dart-defines.json" >> "${GITHUB_ENV}"

      - name: Generate Dart sources for bundle
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned iOS app
        if: inputs.build_unsigned_ios
        run: >-
          flutter build ios --release --no-codesign
          --flavor production
          --target lib/main_production.dart
          --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"
          --dart-define=MEDIGUIDE_FLAVOR=production
          --dart-define=MEDIGUIDE_DEBUG_TOOLS_ENABLED=false
          ${FIREBASE_BUILD_ARGS}

      - name: Archive unsigned iOS app
        if: inputs.build_unsigned_ios
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/ios/iphoneos/Runner.app
          build/ios/iphoneos/mediguide-ios-unsigned.zip

      - name: Enforce iOS artifact size budgets
        if: inputs.build_unsigned_ios
        run: |
          set -eu
          max_app_bytes=$((70 * 1024 * 1024))
          max_archive_bytes=$((35 * 1024 * 1024))
          app="build/ios/iphoneos/Runner.app"
          archive="build/ios/iphoneos/mediguide-ios-unsigned.zip"
          app_kib="$(du -sk "${app}" | awk '{print $1}')"
          app_bytes=$((app_kib * 1024))
          archive_bytes="$(wc -c < "${archive}")"
          echo "Runner.app: ${app_bytes} bytes"
          echo "$(basename "${archive}"): ${archive_bytes} bytes"
          if [ "${app_bytes}" -gt "${max_app_bytes}" ]; then
            echo "${app} exceeds the 70 MiB installed-content budget." >&2
            exit 1
          fi
          if [ "${archive_bytes}" -gt "${max_archive_bytes}" ]; then
            echo "${archive} exceeds the 35 MiB compressed archive budget." >&2
            exit 1
          fi

      - name: Build macOS release
        if: inputs.build_macos
        run: >-
          flutter build macos --release
          --dart-define=MEDIGUIDE_API_BASE_URL="${MOBILE_API_BASE_URL}"

      - name: Archive macOS app
        if: inputs.build_macos
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/macos/Build/Products/Release/MediGuide.app
          build/macos/Build/Products/Release/mediguide-macos.zip

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mediguide-apple-unsigned-${{ github.run_id }}
          path: |
            user_app/build/ios/iphoneos/mediguide-ios-unsigned.zip
            user_app/build/macos/Build/Products/Release/mediguide-macos.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove Firebase build configuration
        if: always()
        run: rm -f firebase-dart-defines.json

  release:
    name: Publish GitHub release
    if: github.repository == 'mohuganda/mediguide-pos' && startsWith(github.ref, 'refs/tags/v')
    needs: android
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the complete GHCR release set
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          owner="$(printf '%s' "${GHCR_OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="${RELEASE_TAG#v}"
          # One shared deadline for the whole set, not 15 minutes per image.
          deadline=$((SECONDS + 600))
          pending=(mediguide-pos-api mediguide-pos-ai-worker mediguide-pos-dashboard mediguide-pos-guidelines)
          while [ "${#pending[@]}" -gt 0 ]; do
            remaining=()
            for package in "${pending[@]}"; do
              image="ghcr.io/${owner}/${package}:${version}"
              docker buildx imagetools inspect "${image}" >/dev/null 2>&1 || remaining+=("${package}")
            done
            pending=("${remaining[@]}")
            if [ "${#pending[@]}" -eq 0 ]; then break; fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Timed out waiting for release images: ${pending[*]}" >&2
              exit 1
            fi
            sleep 20
          done

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mediguide-*
          path: release-artifacts

      - name: Assemble release bundle and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          mkdir -p dist
          version="${RELEASE_TAG#v}"
          mobile_full_version="$(sed -n 's/^version:[[:space:]]*//p' user_app/pubspec.yaml | head -n 1)"
          mobile_version="${mobile_full_version%%+*}"
          mobile_build_number="${mobile_full_version##*+}"
          if [ "${mobile_version}" != "${version}" ] || [ "${mobile_build_number}" = "${mobile_full_version}" ]; then
            echo "Invalid mobile release metadata: ${mobile_full_version}." >&2
            exit 1
          fi
          mobile_artifact_version="${mobile_version}+${mobile_build_number}"
          owner="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          arm_apk="$(find release-artifacts -name 'app-armeabi-v7a-production-release.apk' -print -quit)"
          arm64_apk="$(find release-artifacts -name 'app-arm64-v8a-production-release.apk' -print -quit)"
          aab="$(find release-artifacts -name app-production-release.aab -print -quit)"
          ios="$(find release-artifacts -name mediguide-ios-unsigned.zip -print -quit)"
          macos="$(find release-artifacts -name mediguide-macos.zip -print -quit)"
          web="$(find release-artifacts -type d -name 'mediguide-web-*' -print -quit)"

          test -n "${arm_apk}" && test -n "${arm64_apk}" && test -n "${aab}"
          cp "${arm_apk}" "dist/mediguide-${mobile_artifact_version}-android-armeabi-v7a.apk"
          cp "${arm64_apk}" "dist/mediguide-${mobile_artifact_version}-android-arm64-v8a.apk"
          cp "${aab}" "dist/mediguide-${mobile_artifact_version}-android.aab"

          printf '%s\n' \
            "release_tag=${RELEASE_TAG}" \
            "platform_version=${version}" \
            "mobile_version=${mobile_version}" \
            "mobile_build_number=${mobile_build_number}" \
            "mobile_full_version=${mobile_full_version}" \
            "git_revision=${GITHUB_SHA}" \
            "api_image=ghcr.io/${owner}/mediguide-pos-api:${version}" \
            "ai_worker_image=ghcr.io/${owner}/mediguide-pos-ai-worker:${version}" \
            "dashboard_image=ghcr.io/${owner}/mediguide-pos-dashboard:${version}" \
            "guidelines_image=ghcr.io/${owner}/mediguide-pos-guidelines:${version}" \
            > "dist/mediguide-${version}-release-manifest.txt"
          printf '%s\n' \
            "## MediGuide ${RELEASE_TAG}" \
            "" \
            "Mobile version: ${mobile_version} (build ${mobile_build_number})." \
            "" \
            "The Android APK and AAB are signed with the configured upload key." \
            "Signed iOS distribution and optional web/macOS verification artifacts are separate, explicitly selected workflows." \
            "Use the release manifest for immutable GHCR image references and verify every download with SHA256SUMS." \
            > dist/ARTIFACT-NOTES.md
          python3 scripts/generate-release-notes.py "${RELEASE_TAG}" --check
          cp "docs/releases/${RELEASE_TAG}/release-notes.md" dist/RELEASE-NOTES.md
          for service in mobile api ai-worker dashboard guidelines; do
            cp "docs/releases/${RELEASE_TAG}/${service}.md" "dist/${service}-release-notes.md"
          done
          cp "docs/releases/${RELEASE_TAG}/play-store.txt" dist/PLAY-STORE-NOTES.txt
          cat dist/RELEASE-NOTES.md dist/ARTIFACT-NOTES.md > release-body.md
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
