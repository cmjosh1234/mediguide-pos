info:
  contact:
    email: admin@mediguide.local
    name: MediGuide Backend
  description: Offline-first clinical guideline backend API for MediGuide.
  license:
    name: Proprietary
  termsOfService: https://mediguide.local/terms
  title: MediGuide Backend API
  version: 2.1.5
paths:
  /api/public/assistant/ask:
    post:
      consumes:
      - application/json
      description: Returns citation-first content from approved guideline chunks.
        Anonymous sessions are isolated and rate limited.
      parameters:
      - description: Question payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/services.AskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AskEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Ask the public assistant across approved guidelines
      tags:
      - public-guidelines
  /api/public/diseases:
    get:
      parameters:
      - description: Canonical name, alias, or slug
        in: query
        name: search
        type: string
      - description: Parent disease UUID
        in: query
        name: parent_id
        type: string
      - description: Return root diseases only
        in: query
        name: root_only
        type: boolean
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedPublicDiseasesEnvelope'
      summary: Browse diseases with eligible public content
      tags:
      - public-diseases
  /api/public/diseases/{slug}:
    get:
      parameters:
      - description: Disease slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PublicDiseaseEnvelope'
      summary: Get a disease and its eligible hubs and resources
      tags:
      - public-diseases
  /api/public/diseases/hierarchy:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PublicDiseaseHierarchyEnvelope'
      summary: Browse the eligible public disease hierarchy
      tags:
      - public-diseases
  /api/public/guidelines:
    get:
      parameters:
      - description: Search title, description, or source
        in: query
        name: search
        type: string
      - description: Program area
        in: query
        name: program_area
        type: string
      - description: Guideline category UUID
        in: query
        name: category_id
        type: string
      - description: Disease UUID
        in: query
        name: disease_id
        type: string
      - description: Country
        in: query
        name: country
        type: string
      - description: Language
        in: query
        name: language
        type: string
      - description: RFC3339 lower update bound
        in: query
        name: updated_from
        type: string
      - description: title, publication_date, last_updated, version, or program_area
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedPublicGuidelinesEnvelope'
      summary: List published guidelines
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PublicGuidelineEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Get a published guideline
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/algorithms:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedPublicGuidelineAlgorithmsEnvelope'
      summary: List reviewed algorithms in a published guideline
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/ask:
    post:
      consumes:
      - application/json
      description: Returns citation-first content scoped to the exact current published
        guideline. It does not replace clinical judgement.
      parameters:
      - description: Guideline ID
        in: path
        name: id
        required: true
        type: string
      - description: Question payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/services.AskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AskEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Ask the public assistant about one published guideline
      tags:
      - public-guidelines
  /api/public/guidelines/{id}/assets/{assetId}/download:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      - description: Asset UUID
        in: path
        name: assetId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Download a reviewed published guideline asset through the API
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/content:
    get:
      description: Returns the complete section hierarchy and reviewed blocks in one
        response.
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PublicGuidelineContentEnvelope'
      summary: Get all reviewed structured content for a published guideline
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/figures:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedPublicGuidelineFiguresEnvelope'
      summary: List reviewed figures in a published guideline
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/manifest:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PublicGuidelineManifestEnvelope'
      summary: Get a published guideline content manifest
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/markdown:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/markdown
      responses:
        "200":
          description: OK
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Get published guideline Markdown
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/offline-package:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PublicGuidelineAssetEnvelope'
      summary: Create a short-lived download link for the published offline package
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/offline-package/download:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Response'
      summary: Download the published offline guideline package through the API
      tags:
      - Public Guidelines
  /api/public/guidelines/{id}/original:
    get:
      parameters:
      - description: Guideline UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
