name: user_app
description: "MediGuide Mobile Application"
publish_to: "none"

version: 2.1.6+58

# ============================================================
# ENVIRONMENT
# ============================================================

environment:
  sdk: ^3.8.1

# ============================================================
# DEPENDENCIES
# ============================================================

dependencies:
  flutter:
    sdk: flutter

  # ==========================================================
  # STATE MANAGEMENT
  # ==========================================================

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ==========================================================
  # ROUTING
  # ==========================================================

  go_router: ^16.2.4

  # ==========================================================
  # NETWORKING
  # ==========================================================

  dio: ^5.11.0
  crypto: ^3.0.6
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^3.1.1

  # ==========================================================
  # OFFLINE / LOCAL DATABASE
  # ==========================================================

  # Keep runtime and generator aligned with Riverpod 2.x's source_gen range.
  # Upgrade Drift and Riverpod generators together in a dedicated migration.
  drift: 2.27.0
  sqlite3_flutter_libs: ^0.5.42

  path: ^1.9.1
  path_provider: ^2.1.5

  # ==========================================================
  # LOCAL KEY/VALUE STORAGE
  # ==========================================================

  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.1

  # ==========================================================
  # SERIALIZATION / MODELS
  # ==========================================================

  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ==========================================================
  # UI / DESIGN SYSTEM
  # ==========================================================

  flex_color_scheme: ^8.4.0
  lucide_icons_flutter: ^3.1.9
  gap: ^3.0.1
  responsive_framework: ^1.5.1
  universal_image: ^1.0.11

  # ==========================================================
  # FORMS
  # ==========================================================

  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  form_builder_phone_field: ^3.0.0

  # ==========================================================
  # AUTH / SECURITY
  # ==========================================================

  local_auth: ^3.0.2

  # ==========================================================
  # HTML / WEB CONTENT
  # ==========================================================

  flutter_html: ^3.0.0
  flutter_markdown_plus: ^1.0.12

  # ==========================================================
  # PAGINATION / TREE UI
  # ==========================================================

  infinite_scroll_pagination: ^5.1.1
  animated_tree_view: ^2.3.0

  # ==========================================================
  # DEVICE / FILES
  # ==========================================================

  flutter_pdfview: ^1.4.4
  share_plus: ^12.0.2
  url_launcher: ^6.3.2

  # ==========================================================
  # APP UPDATE / REVIEW
  # ==========================================================

  # 4.2.5 remains compatible with the project-pinned Flutter 3.44.8 / Dart 3.11.
  in_app_update: ^4.2.5
  in_app_review: ^2.0.11

  # ==========================================================
  # AI
  # ==========================================================

  flutter_gen_ai_chat_ui: ^2.5.0

  # ==========================================================
  # OTHER UI
  # ==========================================================

  bubble: ^1.2.1

  # ==========================================================
  # UTILITIES
  # ==========================================================

  intl: ^0.20.2
  # Keep the native Firebase SDK coordinated with the checked-in CocoaPods
  # lockfile. Upgrade the Firebase family together in a dedicated change.
  firebase_core: 4.13.0
  firebase_messaging: ^16.5.0
  firebase_remote_config: ^6.5.6
  firebase_analytics: ^12.4.6
  firebase_crashlytics: 5.2.7
  flutter_local_notifications: ^22.3.0
  package_info_plus: ^9.0.1

# ============================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================

dev_dependencies:
  sqlite3: ^2.9.4
  flutter_test:
    sdk: flutter

  # ==========================================================
  # CODE GENERATION
  # ==========================================================

  build_runner: ^2.4.15

  # Riverpod code generation
  riverpod_generator: ^2.6.5

  # Drift database generation
  drift_dev: 2.27.0

  # Freezed / JSON generation
  freezed: ^3.0.6
  json_serializable: ^6.9.5

  # ==========================================================
  # LINTING
  # ==========================================================

  flutter_lints: ^6.0.0
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

  # ==========================================================
  # BUILD UTILITIES
  # ==========================================================

  package_rename: ^1.10.1
  icons_launcher: ^3.0.3

# ============================================================
# FLUTTER
# ============================================================

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  # ==========================================================
  # ASSETS
  # ==========================================================

  assets:
    # Launcher source artwork is used only by icons_launcher. The generated
    # native launchers already live under android/ and ios/.
    - assets/coat_of_arms.png
    - assets/calculator-theme.css

  # ==========================================================
  # FONTS
  # ==========================================================

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400

        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500

        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700

        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800

        - asset: assets/fonts/Geist-Black.ttf
          weight: 900
