services:
  api:
    build:
      target: development
    command: ["sh", "-c", "/app/migrate up && exec air -c .air.toml"]
    volumes:
      - ../backend:/src
      - api_air_tmp:/src/.air_tmp
      - ../dashboard/samples:/app/legacy-tools:ro
      - ../clinical-tools:/app/clinical-tools:ro
    read_only: false
    restart: "no"
    tty: true
    stdin_open: true

  postgres:
    ports:
      - "${DEV_DATA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PUBLIC_PORT:-5433}:5432"

  minio:
    ports:
      - "${DEV_DATA_BIND_ADDRESS:-127.0.0.1}:${MINIO_PUBLIC_PORT:-9000}:9000"
      - "${DEV_DATA_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PUBLIC_PORT:-9001}:9001"

  dashboard:
    image: "${DASHBOARD_DEV_IMAGE:-mediguide-dashboard:development}"
    build:
      context: ../dashboard
      dockerfile: Dockerfile.dev
      target: development
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
      NEXT_PUBLIC_DASHBOARD_BASE_PATH: "${DASHBOARD_BASE_PATH:-/admin}"
    volumes:
      - ../dashboard:/app
      - dashboard_node_modules:/app/node_modules
      - dashboard_next_cache:/app/.next
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=32m
    read_only: false
    restart: "no"
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:3000$$NEXT_PUBLIC_DASHBOARD_BASE_PATH\" >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  guidelines:
    image: "${GUIDELINES_DEV_IMAGE:-mediguide-guidelines:development}"
    build:
      context: ..
      dockerfile: guidelines-platform/Dockerfile.dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      VITE_MEDIGUIDE_POS_URL: "${DASHBOARD_PUBLIC_URL:-http://localhost:3000}"
      VITE_MEDIGUIDE_API_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
      VITE_HOST: 0.0.0.0
      VITE_PORT: 8080
    volumes:
      - ../guidelines-platform:/app
      - guidelines_node_modules:/app/node_modules
    read_only: false
    restart: "no"
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  api_air_tmp:
  guidelines_node_modules:
  dashboard_node_modules:
  dashboard_next_cache:
