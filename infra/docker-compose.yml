name: mediguide

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-mediguide}"
      POSTGRES_USER: "${POSTGRES_USER:-mediguide}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mediguide}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediguide -d mediguide"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-mediguide}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-mediguide123}"
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_API_CORS_ALLOW_ORIGIN:-*}"
    restart: unless-stopped
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine
    command:
      - redis-server
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY:-noeviction}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: "${API_IMAGE:-mediguide-api:production}"
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: production
      args:
        BUILD_VERSION: "${BUILD_VERSION:-development}"
        BUILD_REVISION: "${BUILD_REVISION:-unknown}"
    environment:
      APP_NAME: mediguide-backend
      APP_ENV: "${APP_ENV:-production}"
      HTTP_PORT: 8080
      AUTO_SEED: "false"
      AUTO_IMPORT: "false"
      LEGACY_CLINICAL_TOOLS_DIR: /app/legacy-tools
      DATABASE_URL: "${DATABASE_URL:-postgres://mediguide:mediguide@postgres:5432/mediguide?sslmode=disable}"
      JWT_SECRET: "${JWT_SECRET:-development-only-change-this-secret-before-production}"
      JWT_ISSUER: "${JWT_ISSUER:-mediguide}"
      JWT_ACCESS_TTL_MINUTES: "${JWT_ACCESS_TTL_MINUTES:-60}"
      JWT_REFRESH_TTL_MINUTES: "${JWT_REFRESH_TTL_MINUTES:-43200}"
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-mediguide:${APP_ENV:-production}}"
      REDIS_CONNECT_TIMEOUT_MS: "${REDIS_CONNECT_TIMEOUT_MS:-1000}"
      REDIS_READ_TIMEOUT_MS: "${REDIS_READ_TIMEOUT_MS:-1000}"
      REDIS_WRITE_TIMEOUT_MS: "${REDIS_WRITE_TIMEOUT_MS:-1000}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_FIREBASE_TEST_PUSH_LIMIT: "${RATE_LIMIT_FIREBASE_TEST_PUSH_LIMIT:-10}"
      RATE_LIMIT_FIREBASE_TEST_PUSH_WINDOW_SECONDS: "${RATE_LIMIT_FIREBASE_TEST_PUSH_WINDOW_SECONDS:-3600}"
      RATE_LIMIT_NOTIFICATION_PUBLICATION_LIMIT: "${RATE_LIMIT_NOTIFICATION_PUBLICATION_LIMIT:-20}"
      RATE_LIMIT_NOTIFICATION_URGENT_PUBLICATION_LIMIT: "${RATE_LIMIT_NOTIFICATION_URGENT_PUBLICATION_LIMIT:-3}"
      RATE_LIMIT_NOTIFICATION_CAMPAIGN_CREATION_LIMIT: "${RATE_LIMIT_NOTIFICATION_CAMPAIGN_CREATION_LIMIT:-10}"
      RATE_LIMIT_NOTIFICATION_URGENT_CAMPAIGN_CREATION_LIMIT: "${RATE_LIMIT_NOTIFICATION_URGENT_CAMPAIGN_CREATION_LIMIT:-3}"
      RATE_LIMIT_NOTIFICATION_CAMPAIGN_APPROVAL_LIMIT: "${RATE_LIMIT_NOTIFICATION_CAMPAIGN_APPROVAL_LIMIT:-20}"
      RATE_LIMIT_NOTIFICATION_URGENT_CAMPAIGN_APPROVAL_LIMIT: "${RATE_LIMIT_NOTIFICATION_URGENT_CAMPAIGN_APPROVAL_LIMIT:-3}"
      RATE_LIMIT_NOTIFICATION_CAMPAIGN_SCHEDULING_LIMIT: "${RATE_LIMIT_NOTIFICATION_CAMPAIGN_SCHEDULING_LIMIT:-10}"
      RATE_LIMIT_NOTIFICATION_URGENT_CAMPAIGN_SCHEDULING_LIMIT: "${RATE_LIMIT_NOTIFICATION_URGENT_CAMPAIGN_SCHEDULING_LIMIT:-3}"
      RATE_LIMIT_NOTIFICATION_DELIVERY_REQUEUE_LIMIT: "${RATE_LIMIT_NOTIFICATION_DELIVERY_REQUEUE_LIMIT:-20}"
      RATE_LIMIT_NOTIFICATION_AUDIENCE_ESTIMATE_LIMIT: "${RATE_LIMIT_NOTIFICATION_AUDIENCE_ESTIMATE_LIMIT:-60}"
      RATE_LIMIT_FIREBASE_REMOTE_CONFIG_WRITE_LIMIT: "${RATE_LIMIT_FIREBASE_REMOTE_CONFIG_WRITE_LIMIT:-10}"
      RATE_LIMIT_NOTIFICATION_DELIVERY_EVENT_LIMIT: "${RATE_LIMIT_NOTIFICATION_DELIVERY_EVENT_LIMIT:-120}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_DEFAULT_TTL_SECONDS: "${CACHE_DEFAULT_TTL_SECONDS:-300}"
      CACHE_MAX_ITEM_BYTES: "${CACHE_MAX_ITEM_BYTES:-1048576}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-mediguide}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-mediguide123}"
      S3_BUCKET: "${S3_BUCKET:-mediguide}"
      S3_USE_SSL: "false"
      GUIDELINE_DIRECT_UPLOADS: "${GUIDELINE_DIRECT_UPLOADS:-false}"
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-}"
      S3_PUBLIC_SSL: "${S3_PUBLIC_SSL:-true}"
      AI_RAG_PROVIDER: worker
      AI_WORKER_URL: http://ai-worker:8090
      AI_WORKER_GRPC_ADDR: ai-worker:50051
      AI_WORKER_TIMEOUT_SECONDS: ${AI_WORKER_TIMEOUT_SECONDS:-120}
      DEFAULT_ADMIN_NAME: "${DEFAULT_ADMIN_NAME:-MediGuide Administrator}"
      DEFAULT_ADMIN_EMAIL: "${DEFAULT_ADMIN_EMAIL:-admin@mediguide.local}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:-Admin123!}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000,http://localhost:5173}"
      PUBLIC_APP_URL: "${DASHBOARD_PUBLIC_URL:-http://localhost:3000}"
      MAIL_DRIVER: "${MAIL_DRIVER:-disabled}"
      MAIL_FROM: "${MAIL_FROM:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      FIREBASE_SERVICE_ACCOUNT_BASE64: "${FIREBASE_SERVICE_ACCOUNT_BASE64:-}"
      FIREBASE_DEVICE_STALE_DAYS: "${FIREBASE_DEVICE_STALE_DAYS:-90}"
      NOTIFICATION_ACTION_EXTERNAL_HOSTS: "${NOTIFICATION_ACTION_EXTERNAL_HOSTS:-mediguide.health.go.ug,health.go.ug,www.health.go.ug,who.int,www.who.int,afro.who.int,www.afro.who.int,iris.who.int}"
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${API_PUBLIC_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6

  notification-worker:
    image: "${API_IMAGE:-mediguide-api:production}"
    command: ["/app/notification-worker"]
    environment:
      APP_NAME: mediguide-notification-worker
      APP_ENV: "${APP_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-postgres://mediguide:mediguide@postgres:5432/mediguide?sslmode=disable}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      FIREBASE_SERVICE_ACCOUNT_BASE64: "${FIREBASE_SERVICE_ACCOUNT_BASE64:-}"
      FIREBASE_DEVICE_STALE_DAYS: "${FIREBASE_DEVICE_STALE_DAYS:-90}"
      NOTIFICATION_ACTION_EXTERNAL_HOSTS: "${NOTIFICATION_ACTION_EXTERNAL_HOSTS:-mediguide.health.go.ug,health.go.ug,www.health.go.ug,who.int,www.who.int,afro.who.int,www.afro.who.int,iris.who.int}"
      NOTIFICATION_WORKER_PORT: "${NOTIFICATION_WORKER_PORT:-8082}"
      NOTIFICATION_WORKER_BATCH_SIZE: "${NOTIFICATION_WORKER_BATCH_SIZE:-100}"
      NOTIFICATION_WORKER_CONCURRENCY: "${NOTIFICATION_WORKER_CONCURRENCY:-10}"
      NOTIFICATION_WORKER_POLL_MS: "${NOTIFICATION_WORKER_POLL_MS:-1000}"
      NOTIFICATION_WORKER_MAX_AGE_HOURS: "${NOTIFICATION_WORKER_MAX_AGE_HOURS:-168}"
      NOTIFICATION_WORKER_LEASE_SECONDS: "${NOTIFICATION_WORKER_LEASE_SECONDS:-120}"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${NOTIFICATION_WORKER_PORT:-8082}/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6

  ai-worker:
    image: "${AI_WORKER_IMAGE:-mediguide-ai-worker:production}"
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_VERSION: "${BUILD_VERSION:-development}"
        BUILD_REVISION: "${BUILD_REVISION:-unknown}"
    environment:
      APP_NAME: mediguide-ai-worker
      APP_ENV: "${APP_ENV:-production}"
      BUILD_VERSION: "${BUILD_VERSION:-development}"
      BUILD_REVISION: "${BUILD_REVISION:-unknown}"
      HTTP_PORT: 8090
      WORKER_GRPC_PORT: 50051
      DATABASE_URL: "${AI_DATABASE_URL:-postgresql://mediguide:mediguide@postgres:5432/mediguide}"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-mediguide}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-mediguide123}"
      S3_BUCKET: "${S3_BUCKET:-mediguide}"
      S3_USE_SSL: "false"
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_DIM: 1024
      CHUNK_SIZE: 320
      CHUNK_OVERLAP: 60
      MIN_CHUNK_CHARS: 120
      EMBEDDING_REQUEST_BATCH_SIZE: 8
      INGESTION_ARTIFACT_REUSE: ${INGESTION_ARTIFACT_REUSE:-true}
      INGESTION_PROCESSING_CONCURRENCY: ${INGESTION_PROCESSING_CONCURRENCY:-true}
      PDF_PAGE_WORKERS: ${PDF_PAGE_WORKERS:-2}
      OCR_WORKERS: ${OCR_WORKERS:-2}
      EMBEDDING_WORKERS: ${EMBEDDING_WORKERS:-2}
      INGESTION_WORKER_CONCURRENCY: ${INGESTION_WORKER_CONCURRENCY:-2}
      INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-120}
      INGESTION_HEARTBEAT_SECONDS: ${INGESTION_HEARTBEAT_SECONDS:-30}
      INGESTION_PRIORITY_AGING_SECONDS: ${INGESTION_PRIORITY_AGING_SECONDS:-900}
      ARTIFACT_CACHE_EPOCH: "${ARTIFACT_CACHE_EPOCH:-1}"
      EMBEDDING_CACHE_MODEL_REVISION: "${EMBEDDING_CACHE_MODEL_REVISION:-}"
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-24}
      RAG_CONTEXT_K: ${RAG_CONTEXT_K:-6}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.25}
      RAG_COUNTRY_BOOST: ${RAG_COUNTRY_BOOST:-0.05}
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P:-0.9}
      OLLAMA_SEED: ${OLLAMA_SEED:-42}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull-models:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  ai-worker-loop:
    image: "${AI_WORKER_IMAGE:-mediguide-ai-worker:production}"
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_VERSION: "${BUILD_VERSION:-development}"
        BUILD_REVISION: "${BUILD_REVISION:-unknown}"
    command: ["python", "-m", "app.worker"]
    environment:
      APP_NAME: mediguide-ai-worker
      APP_ENV: "${APP_ENV:-production}"
      BUILD_VERSION: "${BUILD_VERSION:-development}"
      BUILD_REVISION: "${BUILD_REVISION:-unknown}"
      WORKER_GRPC_PORT: 50051
      DATABASE_URL: "${AI_DATABASE_URL:-postgresql://mediguide:mediguide@postgres:5432/mediguide}"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:-mediguide}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-mediguide123}"
      S3_BUCKET: "${S3_BUCKET:-mediguide}"
      S3_USE_SSL: "false"
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_DIM: 1024
      CHUNK_SIZE: 320
      CHUNK_OVERLAP: 60
      MIN_CHUNK_CHARS: 120
      EMBEDDING_REQUEST_BATCH_SIZE: 8
      INGESTION_ARTIFACT_REUSE: ${INGESTION_ARTIFACT_REUSE:-true}
      INGESTION_PROCESSING_CONCURRENCY: ${INGESTION_PROCESSING_CONCURRENCY:-true}
      PDF_PAGE_WORKERS: ${PDF_PAGE_WORKERS:-2}
      OCR_WORKERS: ${OCR_WORKERS:-2}
      EMBEDDING_WORKERS: ${EMBEDDING_WORKERS:-2}
      INGESTION_WORKER_CONCURRENCY: ${INGESTION_WORKER_CONCURRENCY:-2}
      INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-120}
      INGESTION_HEARTBEAT_SECONDS: ${INGESTION_HEARTBEAT_SECONDS:-30}
      INGESTION_PRIORITY_AGING_SECONDS: ${INGESTION_PRIORITY_AGING_SECONDS:-900}
      ARTIFACT_CACHE_EPOCH: "${ARTIFACT_CACHE_EPOCH:-1}"
      EMBEDDING_CACHE_MODEL_REVISION: "${EMBEDDING_CACHE_MODEL_REVISION:-}"
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-24}
      RAG_CONTEXT_K: ${RAG_CONTEXT_K:-6}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.25}
      RAG_COUNTRY_BOOST: ${RAG_COUNTRY_BOOST:-0.05}
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P:-0.9}
      OLLAMA_SEED: ${OLLAMA_SEED:-42}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull-models:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # This container runs the queue consumer only, so verify process liveness
    # instead of probing the ai-worker HTTP endpoint from the shared image.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  dashboard:
    image: "${DASHBOARD_IMAGE:-mediguide-dashboard:production}"
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
        NEXT_PUBLIC_DASHBOARD_BASE_PATH: "${DASHBOARD_BASE_PATH:-/admin}"
        BUILD_VERSION: "${BUILD_VERSION:-development}"
        BUILD_REVISION: "${BUILD_REVISION:-unknown}"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
      NEXT_PUBLIC_DASHBOARD_BASE_PATH: "${DASHBOARD_BASE_PATH:-/admin}"
      NODE_ENV: production
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PUBLIC_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.NEXT_PUBLIC_DASHBOARD_BASE_PATH||'';fetch('http://127.0.0.1:3000'+p).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  guidelines:
    image: "${GUIDELINES_IMAGE:-mediguide-guidelines:production}"
    build:
      context: ..
      dockerfile: guidelines-platform/Dockerfile.prod
      target: runtime
      args:
        BUILD_VERSION: "${BUILD_VERSION:-development}"
        BUILD_REVISION: "${BUILD_REVISION:-unknown}"
    environment:
      MEDIGUIDE_POS_URL: "${DASHBOARD_PUBLIC_URL:-http://localhost:3000}"
      MEDIGUIDE_API_URL: "${PUBLIC_API_BASE_URL:-http://localhost:8080}"
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${GUIDELINES_PUBLIC_PORT:-5000}:8080"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  ollama:
    image: ollama/ollama:0.32.1
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-pull-models:
    image: curlimages/curl:8.14.1
    restart: "no"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large:latest}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl -fsS -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$OLLAMA_MODEL\",\"stream\":false}"
        curl -fsS -X POST http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$OLLAMA_EMBEDDING_MODEL\",\"stream\":false}"

volumes:
  postgres_data:
  minio_data:
  ollama_data:
